<!doctype html>
<!-- Pythagorean Theorem Game — Idea by: Ms. Nour Kaware · Made by: Mr. Hamza Ashour -->
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="author" content="Idea by: Ms. Nour Kaware; Made by: Mr. Hamza Ashour">
<title>Pythagorean Theorem Game</title>
<style>
  /* mobile first: the whole game always fits the screen, nothing scrolls */
  :root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--amber:#d97706;--sky:#0284c7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    height:100vh;height:100dvh;
    display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;
    grid-template-areas:"hdr" "stage" "panel" "ftr";
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:#f4f5fa;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{grid-area:hdr;position:relative;text-align:center;padding:12px 56px 2px}
  h1{margin:0;font-size:clamp(17px,4.8vw,26px);font-weight:700;letter-spacing:-.015em;line-height:1.2}
  .sub{margin:3px auto 0;max-width:44em;font-size:clamp(12px,3.2vw,14.5px);line-height:1.35;color:var(--muted)}
  .nojs{margin:6px;padding:8px 14px;background:#fff;border:1px solid var(--line);border-radius:10px;font-weight:600;color:#b3261e;font-size:13px}

  .stagewrap{grid-area:stage;min-width:0;min-height:0;display:grid;place-items:center;padding:8px;container-type:size}
  #stage{
    --u:calc(min(100vw - 16px,(100vh - 280px)*.9213)/11.7);
    position:relative;
    width:min(100%,calc((100vh - 280px)*.9213));
    width:min(100cqw,calc(100cqh*.9213));
    aspect-ratio:11.7/12.7;border-radius:18px;background:#fff;
    box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(16,24,40,.05),0 12px 32px rgba(16,24,40,.06);
    overflow:hidden;touch-action:none;container-type:size;
  }
  @supports (width:1cqw){#stage{--u:calc(100cqw/11.7)}}
  #scene,#back,#layer,#frame{position:absolute;inset:0}
  #frame{pointer-events:none}
  .bx{position:absolute;box-sizing:border-box;left:calc(var(--u)*var(--x));top:calc(var(--u)*var(--y));width:calc(var(--u)*var(--w));height:calc(var(--u)*var(--h))}
  .sqA{background:#fff6e3;border:calc(var(--u)*.07) solid #d97706}
  .sqB{background:#e7f5fd;border:calc(var(--u)*.07) solid #0284c7}
  .hyp{background:#f3f4ff}
  .hypline{border:calc(var(--u)*.07) solid #4f46e5;border-radius:calc(var(--u)*.02)}
  .tri{background:#dde1ff;clip-path:polygon(0 0,0 100%,100% 100%)}
  .slot{border-radius:calc(var(--u)*.09);border:calc(var(--u)*.03) dashed}
  .slot.sa{background:#ffefcc;border-color:#f8c968}
  .slot.sb{background:#d3edfb;border-color:#7cc6ee}
  .cell{border-radius:calc(var(--u)*.08);background:#fff;border:calc(var(--u)*.035) dashed #c7d2fe;transform:rotate(-36.87deg)}
  .cell.full{background:#eef2ff}
  .cell.hot{background:#e0e7ff;border:calc(var(--u)*.08) solid #4f46e5}
  .lbl,.edge,.badge,.burst{position:absolute;left:calc(var(--u)*var(--cx));top:calc(var(--u)*var(--cy))}
  .lbl{transform:translate(-50%,-50%);font-weight:700;white-space:nowrap;line-height:1;font-size:calc(var(--u)*var(--fs))}
  .edge{width:calc(var(--u)*var(--len));height:calc(var(--u)*.12);background:#1e1b4b;border-radius:99px;transform:translate(-50%,-50%) rotate(var(--rot))}
  .mark{border:calc(var(--u)*.07) solid #1e1b4b;background:rgba(255,255,255,.92);border-radius:calc(var(--u)*.03)}
  .mark::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--u)*.14);height:calc(var(--u)*.14);margin:calc(var(--u)*-.07) 0 0 calc(var(--u)*-.07);border-radius:50%;background:#1e1b4b}
  .badge{width:calc(var(--u)*.56);height:calc(var(--u)*.56);transform:translate(-50%,-50%);border-radius:50%;border:calc(var(--u)*.05) solid #fff;
         color:#fff;font-weight:700;font-size:calc(var(--u)*.38);line-height:1;display:grid;place-items:center}
  .piece{position:absolute;left:0;top:0;width:var(--u);height:var(--u);margin:calc(var(--u)*-.5) 0 0 calc(var(--u)*-.5);cursor:grab;
         transform:translate(calc(var(--u)*var(--x)),calc(var(--u)*var(--y))) rotate(var(--r)) scale(var(--s))}
  .piece.drag{cursor:grabbing;filter:drop-shadow(0 calc(var(--u)*.1) calc(var(--u)*.1) rgba(17,24,39,.35))}
  .inner{position:absolute;inset:6%;border-radius:calc(var(--u)*.11);border:calc(var(--u)*.045) solid;
         box-shadow:inset 0 0 0 calc(var(--u)*.035) rgba(255,255,255,.38);transition:scale .15s}
  /* faces: happy by default, scared while grabbed */
  .inner i{position:absolute;display:block}
  .eye{top:calc(50% - var(--u)*.07);width:calc(var(--u)*.13);height:calc(var(--u)*.13);margin:calc(var(--u)*-.065) 0 0 calc(var(--u)*-.065);
       border-radius:50%;background:#2b1a4d;border:0 solid #2b1a4d;transition:width .12s,height .12s,margin .12s}
  .eye.l{left:calc(50% - var(--u)*.16)}.eye.r{left:calc(50% + var(--u)*.16)}
  .eye::before{content:"";position:absolute;left:50%;top:calc(var(--u)*-.1);width:calc(var(--u)*.17);height:calc(var(--u)*.035);margin-left:calc(var(--u)*-.085);
       border-radius:9px;background:#2b1a4d;opacity:0;transform:rotate(0deg)}
  .eye.l::before{transform:rotate(-18deg)}.eye.r::before{transform:rotate(18deg)}
  .cheek{top:calc(50% + var(--u)*.03);width:calc(var(--u)*.13);height:calc(var(--u)*.09);margin-left:calc(var(--u)*-.065);border-radius:50%;background:#ff6fa5;opacity:.5}
  .cheek.l{left:calc(50% - var(--u)*.28)}.cheek.r{left:calc(50% + var(--u)*.28)}
  .mouth{left:50%;top:calc(50% + var(--u)*.03);width:calc(var(--u)*.3);height:calc(var(--u)*.16);margin-left:calc(var(--u)*-.15);
         border:calc(var(--u)*.05) solid #2b1a4d;border-top:0;border-radius:0 0 calc(var(--u)*.3) calc(var(--u)*.3);transition:all .12s}
  .inner i.sweat{display:none;right:calc(var(--u)*.02);top:calc(var(--u)*.03);width:calc(var(--u)*.11);height:calc(var(--u)*.11);
         background:#7dd3fc;border-radius:50% 0 50% 50%;transform:rotate(45deg);border:calc(var(--u)*.015) solid #fff}
  .piece.drag .eye{width:calc(var(--u)*.2);height:calc(var(--u)*.2);margin:calc(var(--u)*-.1) 0 0 calc(var(--u)*-.1);
       background:radial-gradient(circle,#2b1a4d 0 30%,#fff 34%);border:calc(var(--u)*.035) solid #2b1a4d}
  .piece.drag .eye::before{opacity:1}
  .piece.drag .cheek{opacity:.15}
  .piece.drag .mouth{width:calc(var(--u)*.13);height:calc(var(--u)*.17);margin-left:calc(var(--u)*-.065);top:calc(50% + var(--u)*.09);
       border:calc(var(--u)*.045) solid #2b1a4d;border-radius:50%;background:#7a2d4a}
  .piece.drag .inner i.sweat{display:block}
  .piece.drag .inner{animation:shiver .1s linear infinite}
  @keyframes shiver{0%,100%{translate:calc(var(--u)*.012) 0}50%{translate:calc(var(--u)*-.012) calc(var(--u)*.006)}}
  .piece.joy:not(.drag) .eye{height:calc(var(--u)*.1);width:calc(var(--u)*.18);margin:calc(var(--u)*-.03) 0 0 calc(var(--u)*-.09);
       background:transparent;border-top:calc(var(--u)*.05) solid #2b1a4d;border-radius:99px 99px 0 0}
  .piece.joy:not(.drag) .mouth{width:calc(var(--u)*.38);height:calc(var(--u)*.23);margin-left:calc(var(--u)*-.19);top:calc(50% + var(--u)*.0);overflow:hidden;
       border:calc(var(--u)*.045) solid #2b1a4d;border-radius:calc(var(--u)*.04) calc(var(--u)*.04) calc(var(--u)*.38) calc(var(--u)*.38);background:#7a2d4a}
  .piece.joy:not(.drag) .mouth::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:50%;background:#ff7a9a;border-radius:99px 99px 0 0}
  .piece.joy:not(.drag) .cheek{opacity:.9;width:calc(var(--u)*.16);height:calc(var(--u)*.1)}
  .piece.joy:not(.drag) .inner{scale:1.08}
  .piece.a .inner{background:#f59e0b;border-color:#d97706}
  .piece.b .inner{background:#0ea5e9;border-color:#0284c7}
  .piece:hover .inner{scale:1.06}
  #stage:not(.started) .hypline{animation:hint 1.8s ease-in-out infinite}
  @keyframes hint{0%,100%{border-color:#4f46e5}50%{border-color:#a5b4fc}}
  .burst{width:0;height:0;pointer-events:none}
  .ring{position:absolute;left:0;top:0;width:calc(var(--u)*.84);height:calc(var(--u)*.84);border:calc(var(--u)*.07) solid;border-radius:50%}
  .dot{position:absolute;left:0;top:0;width:calc(var(--u)*.12);height:calc(var(--u)*.12);margin:calc(var(--u)*-.06) 0 0 calc(var(--u)*-.06);border-radius:50%}

  .panel{grid-area:panel;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(6px,1.1vh,10px) 8px;padding:2px 12px 6px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 11px 9px;
        display:grid;grid-template-columns:minmax(0,1fr);row-gap:4px;min-width:0}
  .lab{font-weight:600;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
  .lab i{width:8px;height:8px;border-radius:50%;flex:none}
  .num{font-weight:700;font-size:19px;line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .num small{font-size:12px;font-weight:600;color:var(--muted)}
  .bar{height:5px;border-radius:99px;background:#eef0f6;overflow:hidden}
  .bar span{display:block;height:100%;width:0;border-radius:99px;transition:width .3s ease}

  #result{grid-column:1/-1;display:grid;place-items:center;min-height:48px;text-align:center;direction:ltr;border-radius:12px;border:1px solid transparent;transition:background .3s,border-color .3s}
  .eqline{font-size:clamp(19px,5.4vw,26px);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .eqline .o{color:var(--amber)}.eqline .b{color:var(--sky)}.eqline .t{color:var(--accent)}
  .eqline .op{color:#9ca3af;font-weight:500;margin:0 .15em}
  .winline{display:none;align-items:center;gap:10px;color:#065f46;font-weight:600;font-size:13.5px;text-align:left;line-height:1.2}
  .winline svg{width:22px;height:22px;flex:none;stroke:#059669}
  .winline b{display:block;font-size:clamp(18px,5vw,22px);font-weight:700;letter-spacing:-.01em;color:#047857}
  #result.won{background:#ecfdf5;border-color:#a7f3d0}
  #result.won .eqline{display:none}
  #result.won .winline{display:flex;animation:rise .45s ease-out}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .btns{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
  button{font:inherit;font-weight:600;font-size:clamp(13.5px,3.9vw,15px);white-space:nowrap;border-radius:12px;height:46px;padding:0 12px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;
    border:1px solid var(--line);background:#fff;color:var(--ink);transition:background .15s,transform .08s,box-shadow .15s}
  button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  button:hover{background:#f9fafb}
  button:active{transform:scale(.97)}
  button:focus-visible{outline:3px solid #c7d2fe;outline-offset:2px}
  #auto{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.35)}
  #auto:hover{background:#4338ca}
  #auto:disabled{background:#eceef3;border-color:#eceef3;color:#9ca3af;box-shadow:none;cursor:default;transform:none}
  #mute{position:absolute;top:10px;right:12px;width:38px;height:38px;padding:0;border-radius:50%}
  #mute svg{width:18px;height:18px}

  footer{grid-area:ftr;display:flex;flex-wrap:wrap;justify-content:center;gap:0 16px;padding:4px 8px 8px;
         font-size:11px;line-height:1.35;color:#9ca3af}
  footer span{white-space:nowrap}
  footer b{color:#4b5563;font-weight:600}

  @media (max-height:520px){.sub{display:none}header{padding-top:6px}}

  @media (orientation:landscape) and (min-aspect-ratio:5/4){
    body{grid-template-columns:minmax(0,1fr) clamp(250px,30vw,380px);grid-template-rows:auto minmax(0,1fr) auto;
         grid-template-areas:"hdr hdr" "stage panel" "ftr ftr"}
    .panel{grid-template-columns:minmax(0,1fr);align-content:center;padding:6px 16px 6px 4px;gap:clamp(6px,1.4vh,12px)}
    .card{grid-template-columns:minmax(0,1fr) auto;align-items:center;padding:10px 14px 11px;row-gap:6px}
    .bar{grid-column:1/-1;height:6px}
    .lab{font-size:clamp(12px,1.3vw,15px)}
    .num{font-size:clamp(19px,2.2vw,26px)}
    .num small{font-size:clamp(12px,1.2vw,14px)}
    .eqline{font-size:clamp(21px,2.4vw,30px)}
    .winline{font-size:clamp(13px,1.3vw,16px)}
    .winline b{font-size:clamp(20px,2.3vw,28px)}
    footer{font-size:clamp(11px,1.1vw,13px)}
    button{font-size:clamp(13px,1.2vw,15px)}
  }
  @media (orientation:landscape) and (min-aspect-ratio:5/4) and (max-height:520px){
    .card{padding:5px 12px 7px;row-gap:3px}
    #result{min-height:40px}
    button{height:38px}
    .panel{gap:5px}
  }
</style>
</head>

<script>
(function(){
const stage=document.getElementById('stage'),back=document.getElementById('back'),layer=document.getElementById('layer');
const OX=4.35,OY=8.45,UW=11.7;
const HROT=-36.87, PLACED=1.075, LIFT=1.12;
const $=id=>document.getElementById(id);
const SPK_ON='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>';

const pieces=[...layer.querySelectorAll('.piece')].map(el=>{
  const hx=+el.dataset.hx,hy=+el.dataset.hy;
  return{el,inner:el.querySelector('.inner'),kind:el.dataset.kind,home:{x:hx,y:hy},
    x:hx,y:hy,rot:0,s:1,tx:hx,ty:hy,trot:0,ts:1,cell:null,dragging:false,last:''};
});
const cells=[...back.querySelectorAll('.cell')].map(el=>({el,i:+el.dataset.i,j:+el.dataset.j,c:{x:+el.dataset.cx,y:+el.dataset.cy},piece:null}));

/* ---------- every square rests with a smile; now and then one suddenly screams with joy, then calms down ---------- */
(function joyLoop(){
  setTimeout(()=>{
    if(!document.hidden&&!busy){
      const pool=pieces.filter(p=>!p.dragging&&!p.el.classList.contains('joy'));
      const p=pool[Math.floor(Math.random()*pool.length)];
      if(p){p.el.classList.add('joy');setTimeout(()=>p.el.classList.remove('joy'),900+Math.random()*800)}
    }
    joyLoop();
  },1100+Math.random()*2400);
})();

/* ---------- easing loop (only touches the DOM when something moves) ---------- */
function render(p){
  const k=p.x.toFixed(3)+'|'+p.y.toFixed(3)+'|'+p.rot.toFixed(2)+'|'+p.s.toFixed(3);
  if(k===p.last)return;p.last=k;
  const st=p.el.style;
  st.setProperty('--x',(p.x+OX).toFixed(4));st.setProperty('--y',(p.y+OY).toFixed(4));
  st.setProperty('--r',p.rot.toFixed(2)+'deg');st.setProperty('--s',p.s.toFixed(4));
}
function tick(){
  for(const p of pieces){
    const dx=p.tx-p.x,dy=p.ty-p.y,dr=p.trot-p.rot,ds=p.ts-p.s;
    if(Math.abs(dx)+Math.abs(dy)+Math.abs(dr)+Math.abs(ds)>.002){
      const k=p.dragging?.4:.3;
      p.x+=dx*k;p.y+=dy*k;p.rot+=dr*k;p.s+=ds*k;
    }else{p.x=p.tx;p.y=p.ty;p.rot=p.trot;p.s=p.ts}
    render(p);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- sound ---------- */
let ac=null,muted=false;
function audio(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(ac&&ac.state==='suspended')ac.resume();
  return ac;
}
function pop(f0,f1,dur=.14,vol=.35){
  if(muted)return;
  const a=audio();if(!a)return;
  const t=a.currentTime,o=a.createOscillator(),g=a.createGain();
  o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
const popOut=()=>pop(900,260,.15);                         // a square comes out
const popPut=(n=0)=>pop(380+n*14,900+n*22,.13);            // a square goes in
function chime(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>pop(f,f*1.01,.35,.25),i*120))}

/* ---------- wobble + sparkles ---------- */
function wobble(p){
  if(!p.inner.animate)return;
  p.inner.animate([
    {transform:'scale(1,1) rotate(0deg)'},
    {transform:'scale(1.3,.7) rotate(-6deg)',offset:.2},
    {transform:'scale(.82,1.2) rotate(6deg)',offset:.4},
    {transform:'scale(1.12,.92) rotate(-4deg)',offset:.62},
    {transform:'scale(.96,1.05) rotate(2deg)',offset:.82},
    {transform:'scale(1,1) rotate(0deg)'}
  ],{duration:560,easing:'ease-out'});
}
function burst(x,y,col){
  if(!stage.animate)return;
  const u=stage.getBoundingClientRect().width/UW;
  const g=document.createElement('div');g.className='burst';
  g.style.setProperty('--cx',x+OX);g.style.setProperty('--cy',y+OY);
  const ring=document.createElement('i');ring.className='ring';ring.style.borderColor=col;g.appendChild(ring);
  ring.animate([{transform:'translate(-50%,-50%) scale(.5)',opacity:.95},{transform:'translate(-50%,-50%) scale(1.9)',opacity:0}],{duration:500,easing:'ease-out',fill:'forwards'});
  const cols=['#f59e0b','#0ea5e9','#6366f1','#ffffff',col];
  for(let i=0;i<7;i++){
    const a=i/7*Math.PI*2+Math.random()*.5,d=(.85+Math.random()*.4)*u;
    const s=document.createElement('i');s.className='dot';s.style.background=cols[i%5];g.appendChild(s);
    s.animate([{transform:'translate(0px,0px)',opacity:1},{transform:'translate('+(Math.cos(a)*d).toFixed(1)+'px,'+(Math.sin(a)*d).toFixed(1)+'px)',opacity:0}],
      {duration:520,easing:'cubic-bezier(.2,.8,.3,1)',fill:'forwards'});
  }
  layer.appendChild(g);setTimeout(()=>g.remove(),620);
}

/* ---------- cells ---------- */
function setCell(c,state){c.el.classList.toggle('hot',state==='hot');c.el.classList.toggle('full',state==='full')}
function place(p,c,n){                       // shared by drag & drop and by Auto fill
  c.piece=p;p.cell=c;setCell(c,'full');
  p.el.classList.remove('idle');
  p.tx=c.c.x;p.ty=c.c.y;p.trot=HROT;p.ts=PLACED;
  stage.classList.add('started');
  popPut(n||0);wobble(p);burst(c.c.x,c.c.y,p.kind==='a'?'#f59e0b':'#0ea5e9');
  updateCount();
}

/* ---------- drag & drop ---------- */
let cur=null,activeId=null,off={x:0,y:0},cand=null,won=false,busy=false,runId=0;
function toUnits(e){
  const r=stage.getBoundingClientRect(),u=r.width/UW;
  return{x:(e.clientX-r.left)/u-OX,y:(e.clientY-r.top)/u-OY};
}
function down(e,p){
  if(cur||busy||(e.button>0))return;
  e.preventDefault();audio();
  cur=p;activeId=e.pointerId;p.dragging=true;p.el.classList.add('drag');p.el.classList.remove('idle');
  try{p.el.setPointerCapture(e.pointerId)}catch(_){}          // keep following the finger outside the window
  layer.appendChild(p.el);                                    // bring to front
  const u=toUnits(e);off={x:p.x-u.x,y:p.y-u.y};
  p.ts=LIFT;
  if(p.cell){setCell(p.cell,'');p.cell.piece=null;p.cell=null;updateCount()}
  popOut();wobble(p);
  clearWin();
}
function nearestFree(x,y){
  let best=null,bd=1.15;
  for(const c of cells){if(c.piece)continue;const d=Math.hypot(c.c.x-x,c.c.y-y);if(d<bd){bd=d;best=c}}
  return best;
}
function move(e){
  if(!cur||e.pointerId!==activeId)return;
  const u=toUnits(e),x=u.x+off.x,y=u.y+off.y;
  const c=nearestFree(x,y);
  if(cand&&cand!==c)setCell(cand,'');
  cand=c;
  if(c){setCell(c,'hot');cur.tx=c.c.x;cur.ty=c.c.y;cur.trot=HROT;cur.ts=PLACED}   // magnet
  else{cur.tx=x;cur.ty=y;cur.trot=0;cur.ts=LIFT}
}
function up(e){
  if(!cur||e.pointerId!==activeId)return;
  const p=cur,c=cand;cur=null;activeId=null;cand=null;p.dragging=false;p.el.classList.remove('drag');
  if(c){place(p,c,0)}
  else{p.tx=p.home.x;p.ty=p.home.y;p.trot=0;p.ts=1;p.el.classList.add('idle');popPut();wobble(p)}
}
pieces.forEach(p=>p.el.addEventListener('pointerdown',e=>down(e,p)));
window.addEventListener('pointermove',move);
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- counters / win ---------- */
function updateCount(){
  let a=0,b=0;
  for(const c of cells)if(c.piece){c.piece.kind==='a'?a++:b++}
  const t=a+b;
  $('ca').textContent=a;$('cb').textContent=b;$('ct').textContent=t;
  $('ea').textContent=a;$('eb').textContent=b;$('ec').textContent=t;
  $('ba').style.width=a/9*100+'%';$('bb').style.width=b/16*100+'%';$('bt').style.width=t/25*100+'%';
  syncAuto();
  if(t===25&&!won){won=true;setTimeout(()=>{if(won)celebrate()},450)}
}
function syncAuto(){
  let t=0;for(const c of cells)if(c.piece)t++;
  $('auto').disabled=busy||t===25;
}
function clearWin(){won=false;$('result').classList.remove('won')}
function celebrate(){
  $('result').classList.add('won');chime();
  for(const p of pieces)setTimeout(()=>wobble(p),Math.random()*500);
}

/* ---------- Auto fill: only when the button is pressed ---------- */
function autofill(){
  if(busy||cur)return;
  audio();
  const todo=pieces.filter(p=>!p.cell);
  const free=cells.filter(c=>!c.piece).sort((a,b)=>(a.j-b.j)||(a.i-b.i));   // the row next to the triangle first
  if(!todo.length)return;
  busy=true;syncAuto();clearWin();
  const my=++runId;let n=0;
  (function step(){
    if(my!==runId)return;
    if(n>=todo.length){busy=false;syncAuto();return}
    const p=todo[n],c=free[n];
    p.el.classList.remove('idle');layer.appendChild(p.el);
    place(p,c,n);n++;
    setTimeout(step,150);
  })();
}

/* ---------- reset ---------- */
function reset(){
  audio();runId++;busy=false;clearWin();stage.classList.remove('started');
  if(cur){cur.dragging=false;cur.el.classList.remove('drag');cur=null;activeId=null;cand=null}
  pieces.forEach((p,i)=>{
    if(p.cell){setCell(p.cell,'');p.cell.piece=null;p.cell=null}
    p.tx=p.home.x;p.ty=p.home.y;p.trot=0;p.ts=1;p.el.classList.add('idle');
    setTimeout(()=>{popPut(i%8);wobble(p)},i*25);
  });
  cells.forEach(c=>setCell(c,''));
  updateCount();
}
$('auto').addEventListener('click',autofill);
$('reset').addEventListener('click',reset);
$('mute').addEventListener('click',()=>{
  muted=!muted;audio();
  $('mute').innerHTML=muted?SPK_OFF:SPK_ON;$('mute').setAttribute('aria-pressed',String(muted));
  if(!muted)popPut();
});
})();
</script>
